name: Montmartre Wine Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check booking availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import re
          import urllib.request
          import urllib.parse
          from pathlib import Path

          URL = "https://fetedesvendangesdemontmartre.com/evenement/les-visites-des-vignes/"
          STATE_FILE = Path("availability_state.txt")

          # Download page
          request = urllib.request.Request(
              URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          html = urllib.request.urlopen(request, timeout=30).read().decode(
              "utf-8", errors="ignore"
          )

          # Remove scripts/styles and HTML tags
          text = re.sub(
              r"<script.*?</script>",
              " ",
              html,
              flags=re.S | re.I
          )
          text = re.sub(
              r"<style.*?</style>",
              " ",
              text,
              flags=re.S | re.I
          )
          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"\s+", " ", text).strip()

          # Current page status
          complete = "Cet événement est complet" in text
          closed = "Inscriptions fermées" in text

          available = not complete and not closed

          print("Page downloaded successfully")
          print("Complete:", complete)
          print("Registrations closed:", closed)
          print("Availability:", available)

          # Previous state
          previous = "unknown"

          if STATE_FILE.exists():
              previous = STATE_FILE.read_text().strip()

          current = "available" if available else "full"

          print("Previous state:", previous)
          print("Current state:", current)

          # Save current state
          STATE_FILE.write_text(current)

          # Only notify when state changes from FULL -> AVAILABLE
          if current == "available" and previous != "available":

              token = os.environ["TELEGRAM_BOT_TOKEN"]
              chat_id = "434528727"

              message = (
                  "🚨🚨 MONTMARTRE WINE ALERT 🚨🚨\n\n"
                  "ВНИМАНИЕ: похоже, появились места "
                  "на Visites des vignes!\n\n"
                  "Проверь бронирование прямо сейчас:\n"
                  + URL
              )

              data = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": message
              }).encode()

              telegram_url = (
                  f"https://api.telegram.org/bot{token}/sendMessage"
              )

              request = urllib.request.Request(
                  telegram_url,
                  data=data,
                  method="POST"
              )

              urllib.request.urlopen(request, timeout=30)

              print("🚨 Telegram alert sent!")

          else:
              print("No new availability alert.")

          PY

      - name: Save state
        run: |
          git config user.name "Montmartre Wine Alert"
          git config user.email "actions@github.com"

          git add availability_state.txt

          git diff --cached --quiet || \
            git commit -m "Update availability state"

          git push
